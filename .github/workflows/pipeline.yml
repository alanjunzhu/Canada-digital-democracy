# Runs the whole pipeline on GitHub's runners, against the live sources.
#
# This is the only place the pipeline has ever met real data. Development
# happens in a sandbox with no egress to lobbycanada.gc.ca, open.canada.ca,
# parl.ca or ourcommons.ca, so the four questions in NOTES.md — and the OCL
# column names — can only be answered by a runner that can reach them.
#
# It is also the answer to 'where does this run': nowhere on anyone's laptop.
# Trigger it by hand, or let the monthly schedule do it — the OCL republishes
# the bulk files monthly, so anything more frequent just re-downloads the same
# file.
name: pipeline

on:
  workflow_dispatch:
    inputs:
      parliaments:
        description: Parliaments to fetch rosters for (comma separated)
        default: '39,40,41,42,43,44,45'
      session:
        description: Parliament-session for bills, e.g. 45-1
        default: '45-1'
  schedule:
    - cron: '17 9 5 * *'      # the 5th of each month, after the OCL publishes
  push:
    branches: ['claude/**']
    paths: ['src/**', '.github/workflows/pipeline.yml', 'data/overrides/**']

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARLIAMENTS: ${{ inputs.parliaments || '39,40,41,42,43,44,45' }}
      SESSION: ${{ inputs.session || '45-1' }}
      # Set this repository variable to a URL the runner can reach if
      # lobbycanada.gc.ca refuses it (a release asset on this repo works).
      OCL_ZIP_URL: ${{ vars.OCL_ZIP_URL }}
      OCL_DICTIONARY_URL: ${{ vars.OCL_DICTIONARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fixture-verified logic first: if the resolver is broken there is no
      # point spending ten minutes downloading to find out.
      - name: Unit tests
        run: npm test

      - name: Validate the office roster
        run: npm run offices 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- data
      # lobbycanada.gc.ca refuses this runner outright (403 to node fetch, curl
      # with either user agent, and wget), so the published zip has to reach CI
      # some other way. Attach it to a release tagged `ocl-data` on this repo
      # and it is used from here on; the direct download is still attempted
      # first, so the mirror stops being needed the day the host serves runners.
      - name: Use the mirrored archive, if one is published
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/raw
          gh release download ocl-data --pattern '*.zip' --dir data/raw --clobber 2>&1 | tee mirror.log || true
          echo "--- data/raw after mirror ---" | tee -a mirror.log
          ls -la data/raw 2>&1 | tee -a mirror.log
          {
            echo '## Mirror'
            echo '```'
            cat mirror.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the OCL bulk files
        id: download
        continue-on-error: true       # a 403 is a finding, not a reason to stop the run
        run: |
          set -o pipefail
          npm run fetch:lobbying 2>&1 | tee download.log
          {
            echo '## Sources'
            echo '```'
            cat download.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The download step already identified each extracted CSV by its headers;
      # this just reads its manifest rather than guessing from filenames again.
      - name: Locate the downloaded CSVs
        id: files
        if: always()
        run: |
          ls -la data/raw || true
          read -r comms dpoh <<<"$(node -e "
            const fs = require('fs');
            let m = {};
            try { m = JSON.parse(fs.readFileSync('data/out/download-manifest.json', 'utf8')).identified || {}; } catch {}
            process.stdout.write((m.communications || '') + ' ' + (m.dpoh || ''));
          ")"
          echo "comms=$comms" >> "$GITHUB_OUTPUT"
          echo "dpoh=$dpoh"   >> "$GITHUB_OUTPUT"
          echo "using comms=$comms dpoh=$dpoh"

      # THE step. Every unverified column name in src/config/sources.mjs is
      # settled here, and the answer is printed whether it matches or not.
      - name: Probe the real column headers
        if: always() && steps.files.outputs.comms != '' && steps.files.outputs.dpoh != ''
        run: |
          set -o pipefail
          npm run probe -- --comms "${{ steps.files.outputs.comms }}" --dpoh "${{ steps.files.outputs.dpoh }}" 2>&1 | tee probe.log
          {
            echo '## Real column headers vs. what the config expects'
            echo '```'
            cat probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------- the questions
      - name: The four questions
        if: always() && steps.files.outputs.comms != '' && steps.files.outputs.dpoh != ''
        continue-on-error: true
        run: |
          set -o pipefail
          npm run stats -- --comms "${{ steps.files.outputs.comms }}" --dpoh "${{ steps.files.outputs.dpoh }}" 2>&1 | tee stats.log
          {
            echo '## The four open questions (NOTES.md)'
            echo '```'
            cat stats.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch members and bills
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run fetch:members -- --parliaments "$PARLIAMENTS" 2>&1 | tee members.log
          npm run fetch:bills   -- --session "$SESSION"       2>&1 | tee bills.log
          {
            echo '## Parliament'
            echo '```'
            cat members.log bills.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A run that downloaded nothing must not look like a run that worked.
      - name: Report a missing download
        if: always() && (steps.files.outputs.comms == '' || steps.files.outputs.dpoh == '')
        run: |
          node -e "
            const fs = require('fs');
            let m = {};
            try { m = JSON.parse(fs.readFileSync('data/out/download-manifest.json', 'utf8')); } catch {}
            for (const f of m.failures || []) {
              console.log(f.key + ': ' + f.error);
              for (const t of f.transports || []) console.log('   ' + t.transport + ' -> ' + (t.status ?? t.error));
            }
          " | tee refused.log
          echo '--- data/raw tree ---' >> refused.log
          ls -laR data/raw 2>&1 | head -60 >> refused.log
          {
            echo '## No lobbying data this run'
            echo 'The OCL bulk files did not download, so the four questions and the'
            echo 'resolution coverage were skipped. Which clients the host refused:'
            echo '```'
            cat refused.log
            echo '```'
            echo 'If every client is refused, the host is not serving CI runners.'
            echo 'Put the zip somewhere the runner can reach (a release asset on this'
            echo 'repo works) and set the repository variable OCL_ZIP_URL to it.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Entity resolution coverage
        if: always() && steps.files.outputs.comms != '' && steps.files.outputs.dpoh != ''
        continue-on-error: true
        run: |
          set -o pipefail
          npm run resolve -- --members data/out/members-all.json \
            --comms "${{ steps.files.outputs.comms }}" --dpoh "${{ steps.files.outputs.dpoh }}" 2>&1 | tee resolve.log
          {
            echo '## Resolution coverage'
            echo '```'
            cat resolve.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reports are small JSON; the raw bulk files are not kept.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            data/out/*.json
            *.log
          if-no-files-found: warn
          retention-days: 30

      # The data dictionary is the artefact that settles the column question
      # for good, so it is kept separately from the reports.
      - name: Upload the OCL data dictionary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocl-data-dictionary
          path: data/raw/dictionary.*
          if-no-files-found: ignore
          retention-days: 30
